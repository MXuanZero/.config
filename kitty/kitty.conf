# 强制 kitty 走 X11/XWayland，由 GNOME 绘制窗口标题栏（圆形按钮）
linux_display_server x11
wayland_enable_ime yes

# ============ 颜色：取自 Ptyxis 内置 GNOME 调色板（深色）============
background #1c1c1f
foreground #ffffff
cursor     #ffffff

color0  #241f31
color1  #c01c28
color2  #2ec27e
color3  #f5c211
color4  #1e78e4
color5  #9841bb
color6  #0ab9dc
color7  #c0bfbc
color8  #5e5c64
color9  #ed333b
color10 #57e389
color11 #f8e45c
color12 #51a1ff
color13 #c061cb
color14 #4fd2fd
color15 #f6f5f4

# ============ 字体：JetBrainsMono Nerd Font（非 Mono 变体，Medium 14）============
# 用非 Mono 变体：Nerd Font 图标按双宽渲染，配 eza --icons 不会挤压变形
# 图标与文件名间距可在 shell 里用 EZA_ICON_SPACING=1|2 微调
font_family family="JetBrainsMono Nerd Font" style=Medium
font_size   14.0

# ============ 滚动：与 Ptyxis 一致（scrollback-lines=10000）============
scrollback_lines 10000

# ============ 分屏：Ctrl+Shift+Enter 默认左右分屏 ============
# 把 splits 放首位 -> 成为默认布局（其余布局仍可用 Ctrl+Shift+L 切换）
enabled_layouts splits,stack,tall,vertical,horizontal,grid,fat
# 新建窗口时在当前窗口右侧左右分屏（vsplit = 并排；hsplit = 上下）
map kitty_mod+enter launch --location=vsplit

# ============ 响铃：关闭声音，改为窗口闪烁 ============
enable_audio_bell no
visual_bell_duration 0.15
visual_bell_color none
window_alert_on_bell yes
bell_on_tab yes
