# 强制 kitty 走 X11/XWayland，由 GNOME 绘制窗口标题栏（圆形按钮）
linux_display_server x11

# ============ 颜色：取自 Ptyxis 内置 GNOME 调色板（深色）============
background #1c1c1f
foreground #ffffff
cursor     #ffffff

color0  #241f31
color1  #c01c28
color2  #2ec27e
color3  #f5c211
color4  #1e78e4
color5  #9841bb
color6  #0ab9dc
color7  #c0bfbc
color8  #5e5c64
color9  #ed333b
color10 #57e389
color11 #f8e45c
color12 #51a1ff
color13 #c061cb
color14 #4fd2fd
color15 #f6f5f4

# ============ 字体：与 Ptyxis 一致（JetBrainsMono Nerd Font Mono Medium 14）============
font_family family="JetBrainsMono Nerd Font Mono" style=Medium
font_size   14.0

# ============ 滚动：与 Ptyxis 一致（scrollback-lines=10000）============
scrollback_lines 10000
